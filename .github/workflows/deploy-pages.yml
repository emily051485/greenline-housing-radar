name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 02:17 UTC = 10:17 Taiwan time. Refresh the short-lived public NCDR token daily.
    - cron: '17 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Fetch NCDR flood-map token
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const response = await fetch("https://dmap.ncdr.nat.gov.tw/api/tokeninfo");
            if (!response.ok) throw new Error(`NCDR token request failed: ${response.status}`);
            const envelope = await response.json();
            const data = typeof envelope === "string" ? JSON.parse(envelope) : envelope;
            if (!data.token) throw new Error("NCDR response did not include a token");
            appendFileSync(process.env.GITHUB_ENV, `VITE_NCDR_TOKEN=${data.token}\n`);
            appendFileSync(process.env.GITHUB_ENV, `VITE_NCDR_TOKEN_EXPIRES=${data.expires ?? ""}\n`);
          '
      - name: Build
        run: npm run build -- --base=/greenline-housing-radar/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
